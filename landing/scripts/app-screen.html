<!doctype html>
<!--
  Fuente de `landing/assets/screenshots/home.png`, la pantalla que se ve
  dentro del teléfono del hero.

  Se renderiza con `bash landing/scripts/render-screens.sh`. Mismo patrón que
  `scripts/app-icons.html` y `landing/scripts/og-image.html`: el PNG es un
  fichero generado y quien manda es este HTML.

  ⚠️ QUÉ ES ESTO Y QUÉ NO ES

  Es una reproducción de la pantalla principal montada con los mismos tokens
  que corre la app: `landing/styles/tokens.css` sale de
  `src/constants/colors.ts`, las medidas salen del `StyleSheet` de
  `src/app/(tabs)/index.tsx` y los textos son los de
  `src/lib/i18n/translations/es.ts`, copiados literalmente. No hay ni un
  color, ni un radio, ni una cadena inventada.

  NO es una captura de la app corriendo. Sirve para la landing, pero **no
  vale para la ficha de Google Play**: las capturas de la ficha tienen que
  ser del producto real, y Play rechaza los montajes. Cuando existan las
  capturas de verdad (ver `landing/assets/screenshots/README.md`), se
  sustituye este PNG por la captura del dispositivo y este archivo se queda
  como respaldo.

  Lienzo: 360x800 px CSS, que es el tamaño lógico de un Android normal. El
  script lo renderiza a 3x para sacar el PNG de 1080x2400.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      /*
       * La escala de la app en crudo. Aquí NO valen los pasos de tipografía
       * de la landing (`--type-hero` y compañía): esto tiene que salir con
       * los tamaños exactos de `Typography` en src/constants/theme.ts, que
       * son los que ve el usuario en el móvil.
       */
      .screen {
        position: relative;
        width: 360px;
        height: 800px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background-color: var(--color-background);
        color: var(--color-text);
        font-family: var(--font-body);
      }

      /* Barra de estado del sistema. */
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px 2px;
        font-family: var(--font-display);
        font-size: 13px;
        color: var(--color-text);
      }

      /* `styles.content`: padding 16, gap 16, ancho completo. */
      /*
       * En la app esto es un `ScrollView`. Aquí se recorta por abajo igual
       * que se recortaría en el móvil: el último botón queda a medias bajo
       * la barra de pestañas, que es exactamente lo que se ve en una captura
       * real de esta pantalla.
       */
      .content {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }

      /* ── Cabecera ──────────────────────────────────────────────────── */

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /*
       * `AVATAR_SIZE = 44`. Sin foto, `FrameOverlay` cae al hueco `sunken`,
       * que es lo que ve una cuenta recién hecha.
       */
      .avatar {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 16px;
        background-color: var(--color-surface-sunken);
        border: 1px solid var(--color-border);
      }

      .identity {
        flex: 1;
        font-family: var(--font-display);
        font-size: 16px;
        line-height: 24px;
      }

      /* ── Chip ──────────────────────────────────────────────────────── */

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 5px 12px;
        border-radius: 999px;
        font-family: var(--font-display);
        font-size: 12px;
        line-height: 16px;
        background-color: var(--color-primary-surface);
        color: var(--color-primary);
      }

      /* ── Foto grande y racha ───────────────────────────────────────── */

      /* `characterWrap`: la mitad del ancho del contenido, cuadrada. */
      .character {
        position: relative;
        width: 50%;
        aspect-ratio: 1;
        align-self: center;
        border-radius: 16px;
        background-color: var(--color-surface-sunken);
        border: 1px solid var(--color-border);
      }

      .streak {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background-color: var(--color-surface-raised);
        font-size: 12px;
        line-height: 16px;
        color: var(--color-streak);
      }

      /* `styles.level`: `heading` centrado. */
      .level {
        margin: 0;
        text-align: center;
        font-family: var(--font-display);
        font-size: 24px;
        line-height: 30px;
      }

      /* ── Barras ────────────────────────────────────────────────────── */

      .track {
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
      }

      .track--xp {
        background-color: var(--color-xp-track);
      }

      .track--meter {
        background-color: var(--color-meter-track);
      }

      .fill {
        height: 100%;
        border-radius: 999px;
      }

      .fill--xp {
        background-image: var(--gradient-xp);
      }

      .fill--steps {
        background-color: var(--color-steps);
      }

      .fill--power {
        background-color: var(--color-primary);
      }

      .fill--rival {
        background-color: var(--color-defeat);
      }

      /* `XpProgress`: barra y, debajo, las dos cifras a los lados. */
      .xp {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .spread {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* ── Cards ─────────────────────────────────────────────────────── */

      /* `Card` + `styles.block` (gap 8). */
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
        border-radius: 16px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
      }

      .card--highlight {
        background-color: var(--color-surface-raised);
        border-color: var(--color-primary-edge);
      }

      /* ── Texto ─────────────────────────────────────────────────────── */

      .label {
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 11px;
        line-height: 14px;
        letter-spacing: 0.8px;
        color: var(--color-text-dim);
      }

      .label--primary {
        color: var(--color-primary);
      }

      .label--muted {
        color: var(--color-text-muted);
      }

      .caption {
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 12px;
        line-height: 16px;
      }

      .caption--xp {
        color: var(--color-xp);
      }

      .caption--muted {
        color: var(--color-text-muted);
      }

      /* `Typography.title`: la cifra de pasos. */
      .steps-count {
        font-family: var(--font-display);
        font-size: 48px;
        line-height: 52px;
        color: var(--color-steps);
        font-variant-numeric: tabular-nums;
      }

      /* `Typography.smallBold` y `Typography.numeric` del duelo. */
      .duel-name {
        font-family: var(--font-display);
        font-size: 14px;
        line-height: 20px;
      }

      .duel-count {
        font-family: var(--font-display);
        font-size: 20px;
        line-height: 24px;
        font-variant-numeric: tabular-nums;
      }

      .duel-count--power {
        color: var(--color-primary);
      }

      .duel-count--rival {
        color: var(--color-defeat);
      }

      /* ── Fila del duelo ────────────────────────────────────────────── */

      .duel-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* `DUEL_AVATAR_SIZE = 36`, con borde de 2 del color del lado. */
      .duel-avatar {
        width: 36px;
        height: 36px;
        flex: none;
        border-radius: 16px;
        background-color: var(--color-surface-sunken);
        border: 2px solid var(--color-primary-edge-strong);
      }

      .duel-avatar--rival {
        border-color: var(--color-rival-edge);
      }

      .duel-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ── Botones ───────────────────────────────────────────────────── */

      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border-radius: 999px;
        font-family: var(--font-display);
        font-size: 15px;
        line-height: 20px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .button--primary {
        background-color: var(--color-primary);
        color: var(--color-on-primary);
      }

      .button--secondary {
        background-color: var(--color-neutral-surface);
        border: 1px solid var(--color-border-strong);
        color: var(--color-text);
      }

      /* ── Barra de pestañas ─────────────────────────────────────────── */

      .dock {
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 10px 8px 18px;
        background-color: var(--color-dock);
        border-top: 1px solid var(--color-border);
        font-size: 11px;
        font-weight: 500;
        color: var(--color-nav-idle);
      }

      .dock span[data-selected] {
        color: var(--color-primary);
      }
    </style>
  </head>

  <body>
    <div class="screen">
      <div class="status">
        <span>14:32</span>
        <span>82%</span>
      </div>

      <div class="content">
        <!-- Cabecera: foto, nombre y nivel. -->
        <div class="header">
          <div class="avatar"></div>
          <div class="identity">alexruiz</div>
          <span class="chip">NV 12</span>
        </div>

        <!-- Foto grande con la racha encima. -->
        <div class="character">
          <span class="streak">🔥 9</span>
        </div>

        <h1 class="level">NIVEL 12</h1>

        <!-- XpProgress. -->
        <div class="xp">
          <div class="track track--xp">
            <div class="fill fill--xp" style="width: 82%"></div>
          </div>
          <div class="spread">
            <span class="caption caption--xp">2.450 / 3.000 XP</span>
            <span class="caption caption--muted">550 XP PARA NV 13</span>
          </div>
        </div>

        <!-- StepsCard. -->
        <div class="card">
          <span class="label">PASOS DE HOY</span>
          <span class="steps-count">8.742</span>
          <span class="caption caption--muted">+1.258 para la meta · 10.000</span>
          <div class="track track--meter">
            <div class="fill fill--steps" style="width: 87%"></div>
          </div>
        </div>

        <!-- CurrentDuelCard. -->
        <div class="card card--highlight">
          <div class="spread">
            <span class="label label--primary">DUELO EN CURSO</span>
            <span class="label label--muted">TERMINA EN 2D</span>
          </div>

          <div class="duel-row">
            <div class="duel-avatar"></div>
            <div class="duel-body">
              <div class="spread">
                <span class="duel-name">alexruiz</span>
                <span class="duel-count duel-count--power">8.742</span>
              </div>
              <div class="track track--meter">
                <div class="fill fill--power" style="width: 100%"></div>
              </div>
            </div>
          </div>

          <div class="duel-row">
            <div class="duel-avatar duel-avatar--rival"></div>
            <div class="duel-body">
              <div class="spread">
                <span class="duel-name">nereasoler</span>
                <span class="duel-count duel-count--rival">7.538</span>
              </div>
              <div class="track track--meter">
                <div class="fill fill--rival" style="width: 86.2%"></div>
              </div>
            </div>
          </div>

          <div class="button button--primary">Ver duelo</div>
        </div>

        <div class="button button--secondary">Retar a un amigo</div>
      </div>

      <nav class="dock">
        <span data-selected>Inicio</span>
        <span>Duelos</span>
        <span>Amigos</span>
        <span>Perfil</span>
      </nav>
    </div>
  </body>
</html>
